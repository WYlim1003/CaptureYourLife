name: capture_your_life
description: AI-powered mobile app for capturing and creating stickers and avatars from photos.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Firebase (Auth + Database only)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.2.2

  # AI (Phase 2 — Gemini)
  google_generative_ai: ^0.4.6

  # Networking
  http: ^1.1.0
  dio: ^5.3.1

  # Image handling
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  cross_file: ^0.3.4

  # Save & share
  gal: ^1.1.0
  share_plus: ^7.2.1

  # Storage & utils
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  intl: ^0.18.1

  # UI
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.1.0

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
