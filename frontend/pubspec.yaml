name: capture_your_life
description: AI-powered mobile app for capturing and creating stickers and avatars from photos.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Firebase (Auth + Database only)
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.1

  # Image handling
  image_picker: ^1.0.4
  path_provider: ^2.1.1

  # Save & share
  gal: ^1.1.0
  share_plus: ^7.2.1

  # Storage & utils
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  intl: ^0.18.1

  # UI
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
